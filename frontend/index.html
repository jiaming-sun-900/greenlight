<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- One tag, no media query: the visitor can choose a theme the operating
         system disagrees with, and the address bar should follow the page they
         are actually looking at. Kept current by the script below and by
         src/hooks/useTheme.js. -->
    <meta name="theme-color" content="#f0eee6" />
    <title>Greenlight</title>
    <script>
      // Runs before first paint so a dark-mode user never sees a white flash on
      // the way to their theme. React cannot do this: by the time it mounts the
      // page has already painted. Kept in sync by src/hooks/useTheme.js, which
      // owns the same storage key.
      (function () {
        try {
          var stored = localStorage.getItem("greenlight_theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome) chrome.content = dark ? "#171615" : "#f0eee6";
        } catch (e) {
          // Storage blocked: fall through to the light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
